<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myzon - India's Favorite E-Commerce Store</title>
    <meta http-equiv="refresh" content="0; url=http://localhost:5173/">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #131921;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: #232f3e;
            padding: 40px;
            border-radius: 16px;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid #37475a;
        }
        .logo {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 8px;
        }
        .logo span {
            color: #ff9900;
        }
        .badge {
            background: #febd69;
            color: #111;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        p {
            color: #ccc;
            font-size: 14px;
            line-height: 1.6;
            margin: 20px 0;
        }
        .btn {
            display: inline-block;
            background: #febd69;
            color: #111;
            padding: 14px 28px;
            font-weight: 700;
            border-radius: 8px;
            text-decoration: none;
            transition: background 0.2s;
            font-size: 15px;
        }
        .btn:hover {
            background: #f3a847;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">My<span>zon</span> <span class="badge">Flipkart & Amazon</span></div>
        <p>Redirecting you to the Myzon Storefront (React + Vite)...</p>
        <a href="http://localhost:5173/" class="btn">Open Myzon Store (http://localhost:5173)</a>
    </div>
    <script>
        window.location.href = "http://localhost:5173/";
    </script>
</body>
</html>
